apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter
spec:
  selector:
    matchLabels:
      app: twitterapp
  replicas: 2
  template:
    metadata:
      labels:
        app: twitterapp
    spec:
      containers:
        - name: twitter-application
          image: jeeva08raj/twitterapp:2nd-release # Updated image to private DockerHub image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: regcred # Reference to the Docker registry secret
---
apiVersion: v1
kind: Service
metadata:
  name: twitterapp-ssvc
spec:
  selector:
    app: twitterapp
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080 
  type: LoadBalancer
