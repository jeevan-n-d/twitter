apiVersion: apps/v1
kind: Deployment

metadata:
  name: twitter
  namespace: webapps

spec:
  replicas: 3

  selector:
    matchLabels:
      app: twitterapp

  template:
    metadata:
      labels:
        app: twitterapp

    spec:
      imagePullSecrets:
        - name: regcred

      containers:
        - name: twitter-application
          image: jeeva08raj/twitter:v5
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20

---

apiVersion: v1
kind: Service

metadata:
  name: twitterapp-ssvc
  namespace: webapps

  annotations:
    cloud.google.com/backend-config: '{"default":"twitter-backendconfig"}'

spec:
  selector:
    app: twitterapp

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

  type: ClusterIP
