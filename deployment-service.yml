apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: twitterapp
  replicas: 3
  template:
    metadata:
      labels:
        app: twitterapp
    spec:
      containers:
        - name: twitter-application
          image: jeeva08raj/twitter:release-4
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: regcred

---

apiVersion: v1
kind: Service
metadata:
  name: twitterapp-ssvc
  namespace: webapps
spec:
  selector:
    app: twitterapp
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080
  type: ClusterIP
